[project]
name = "neurocad"
version = "0.1.15"
description = "NeuroCad — core engine + CMS + visual editor for FastAPI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Aleksey Smirnov" },
]

keywords = [
    "fastapi",
    "cms",
    "engine",
    "grapesjs",
    "visual-editor",
    "neurocad",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi",
    "starlette",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic[email]",
    "pydantic-settings",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "aiosqlite",
    "aiologger",
    "aiofiles",
    "jinja2",
    "alembic",
    "httpx",
    "tiktoken",    
]

[project.optional-dependencies]
mysql = ["aiomysql"]
postgres = ["asyncpg"]
dev = ["pytest", "ruff", "mypy", "build", "twine"]

[project.scripts]
neurocad = "neurocad.cli:main"

[project.urls]
Homepage = "https://github.com/aleksmir-dev/neurocad"
Repository = "https://github.com/aleksmir-dev/neurocad"
Issues = "https://github.com/aleksmir-dev/neurocad/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurocad"]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "neurocad/static/**",
]

[tool.hatch.build.targets.wheel.force-include]
"neurocad/static/libs"  = "neurocad/static/libs"
"neurocad/static/fonts" = "neurocad/static/fonts"

[tool.hatch.build.targets.sdist]
include = [
    "neurocad/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]