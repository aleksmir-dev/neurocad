<!-- templates/dashboard/index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Дашборд</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack/dist/gridstack.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Глобально запрещаем прокрутку страницы */
        html, body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Основной контейнер — flex-сетка на всю высоту */
        .dashboard {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* ========== NAVBAR (фиксированная шапка) ========== */
        .navbar {
            height: 60px;
            background: #1e1e2f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 100;
        }
        .navbar .logo {
            font-size: 20px;
            font-weight: bold;
        }
        .navbar .user-menu {
            display: flex;
            gap: 15px;
        }
        .navbar button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        /* ========== ОСНОВНОЙ КОНТЕЙНЕР (средняя часть) ========== */
        .main-layout {
            display: flex;
            flex: 1;
            min-height: 0;  /* важно для правильной работы flex */
            overflow: hidden;
        }

        /* ========== LEFT SIDEBAR (фиксированный слева) ========== */
        .sidebar-left {
            width: 260px;
            background: #f8f9fa;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        .sidebar-left .sidebar-header {
            padding: 15px;
            font-weight: bold;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        .sidebar-left .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .sidebar-left .sidebar-content ul {
            list-style: none;
        }
        .sidebar-left .sidebar-content li {
            padding: 8px 12px;
            margin: 2px 0;
            border-radius: 6px;
            cursor: pointer;
        }
        .sidebar-left .sidebar-content li:hover {
            background: #e9ecef;
        }

        /* ========== RIGHT SIDEBAR (фиксированный справа) ========== */
        .sidebar-right {
            width: 280px;
            background: #f8f9fa;
            border-left: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        .sidebar-right .sidebar-header {
            padding: 15px;
            font-weight: bold;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        .sidebar-right .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .sidebar-right .widget-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar-right .widget-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            cursor: grab;
            transition: all 0.2s;
        }
        .sidebar-right .widget-item:hover {
            background: #e9ecef;
            transform: translateX(-2px);
        }
        .sidebar-right .widget-item:active {
            cursor: grabbing;
        }

        /* ========== MAIN CONTENT (область виджетов) ========== */
        .main-content {
            flex: 1;
            background: #f0f2f5;
            padding: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* Контейнер для grid-stack */
        .widget-container {
            flex: 1;
            min-height: 0;
            position: relative;
        }
        
        /* Стили для виджетов GridStack */
        .grid-stack {
            background: transparent;
            height: 100%;
        }
        .grid-stack-item {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .grid-stack-item-content {
            height: 100% !important;
            width: 100% !important;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Заголовок виджета */
        .widget-header {
            background: #f8f9fa;
            padding: 10px 15px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            flex-shrink: 0;
        }
        .widget-header .widget-title {
            font-weight: 500;
            font-size: 14px;
        }
        .widget-header .widget-actions {
            display: flex;
            gap: 8px;
        }
        .widget-header .widget-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: #6c757d;
            font-size: 12px;
        }
        .widget-header .widget-actions button:hover {
            color: #dc3545;
        }
        
        /* Тело виджета — здесь своя прокрутка */
        .widget-body {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            min-height: 0;
        }
        
        /* ========== FOOTER (фиксированный внизу) ========== */
        .footer {
            height: 40px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #6c757d;
            flex-shrink: 0;
        }
        
        /* Скроллбары (красивые) */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .sidebar-left, .sidebar-right {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- NAVBAR (фиксированная шапка) -->
        <div class="navbar">
            <div class="logo">📊 LIGHT Dashboard</div>
            <div class="user-menu">
                <button id="save-dashboard">💾 Сохранить</button>
                <button id="reset-dashboard">🔄 Сбросить</button>
                <span>👤 Администратор</span>
            </div>
        </div>

        <!-- Основной контейнер -->
        <div class="main-layout">
            <!-- LEFT SIDEBAR (фиксированный слева, своя прокрутка) -->
            <div class="sidebar-left">
                <div class="sidebar-header">📁 Меню</div>
                <div class="sidebar-content">
                    <ul>
                        <li>🏠 Главная</li>
                        <li>📊 Отчёты</li>
                        <li>👥 Пользователи</li>
                        <li>💰 Платежи</li>
                        <li>📦 Подписки</li>
                        <li>⚙️ Настройки</li>
                    </ul>
                </div>
            </div>

            <!-- MAIN CONTENT (область виджетов) -->
            <div class="main-content">
                <div class="widget-container">
                    <div class="grid-stack" id="grid-stack"></div>
                </div>
            </div>

            <!-- RIGHT SIDEBAR (фиксированный справа, своя прокрутка) -->
            <div class="sidebar-right">
                <div class="sidebar-header">➕ Добавить виджет</div>
                <div class="sidebar-content">
                    <div class="widget-list" id="widget-list">
                        <div class="widget-item" data-type="table">
                            📋 Таблица (AG Grid)
                        </div>
                        <div class="widget-item" data-type="chart">
                            📊 График (ECharts)
                        </div>
                        <div class="widget-item" data-type="stats">
                            📈 Статистика (карточки)
                        </div>
                        <div class="widget-item" data-type="text">
                            📝 Текстовый блок
                        </div>
                        <div class="widget-item" data-type="calendar">
                            📅 Календарь
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- FOOTER (фиксированный внизу) -->
        <div class="footer">
            © 2026 LIGHT Dashboard. Все права защищены.
        </div>
    </div>

    <!-- Подключение библиотек -->
    <script src="https://cdn.jsdelivr.net/npm/gridstack/dist/gridstack-all.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // ===================== Инициализация GridStack v11 =====================
            const grid = GridStack.init({
                column: 12,
                cellHeight: 100,
                verticalMargin: 10,
                resizable: { handles: 'e, se, s, sw, w' },
                draggable: { handle: '.widget-header' },
            });

            // ===================== Утилиты =====================
            const generateId = () => 'widget_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

            const getWidgetTitle = (type) => ({
                table: '📋 Таблица данных',
                chart: '📊 График',
                stats: '📈 Статистика',
                text: '📝 Заметки',
                calendar: '📅 Календарь'
            }[type] || 'Виджет');

            // ===================== Создание виджета =====================
            function addWidget(type, id = null, title = null, x = 0, y = 0, w = 4, h = 3) {
                const widgetId = id || generateId();
                const widgetTitle = title || getWidgetTitle(type);

                const wrapper = document.createElement('div');
                wrapper.className = 'grid-stack-item';
                wrapper.setAttribute('gs-id', widgetId);
                wrapper.setAttribute('gs-x', x);
                wrapper.setAttribute('gs-y', y);
                wrapper.setAttribute('gs-w', w);
                wrapper.setAttribute('gs-h', h);

                wrapper.innerHTML = `
                    <div class="grid-stack-item-content">
                        <div class="widget-header">
                            <span class="widget-title">${widgetTitle}</span>
                            <div class="widget-actions">
                                <button class="widget-refresh" title="Обновить">🔄</button>
                                <button class="widget-remove" title="Удалить">✖</button>
                            </div>
                        </div>
                        <div class="widget-body" id="${widgetId}_body">
                            <div id="${widgetId}_content" style="height:100%; width:100%;">Загрузка...</div>
                        </div>
                    </div>
                `;

                grid.makeWidget(wrapper);

                // Контент виджета
                renderWidgetContent(widgetId, type);

                // Кнопки управления
                wrapper.querySelector('.widget-remove').addEventListener('click', () => grid.removeWidget(wrapper));
                wrapper.querySelector('.widget-refresh').addEventListener('click', () => renderWidgetContent(widgetId, type));

                return widgetId;
            }

            // ===================== Рендер содержимого виджета =====================
            async function renderWidgetContent(widgetId, type) {
                const container = document.getElementById(`${widgetId}_content`);
                if (!container) return;

                if (type === 'table') {
                    container.innerHTML = `<div id="${widgetId}_grid" class="ag-theme-alpine" style="height:100%; width:100%;"></div>`;
                    const gridDiv = document.getElementById(`${widgetId}_grid`);

                    const rowData = [
                        { id: 1, name: 'Платеж #1', amount: 1500, status: 'Успешно' },
                        { id: 2, name: 'Платеж #2', amount: 2500, status: 'Успешно' },
                        { id: 3, name: 'Платеж #3', amount: 500, status: 'Ошибка' },
                    ];

                    new agGrid.Grid(gridDiv, {
                        columnDefs: [
                            { field: 'id', headerName: 'ID', width: 80 },
                            { field: 'name', headerName: 'Название', editable: true },
                            { field: 'amount', headerName: 'Сумма', editable: true },
                            { field: 'status', headerName: 'Статус' }
                        ],
                        rowData: rowData,
                        domLayout: 'autoHeight',
                        pagination: true,
                        paginationPageSize: 10
                    });

                } else if (type === 'chart') {
                    container.innerHTML = `<div id="${widgetId}_chart" style="height:100%; width:100%;"></div>`;
                    const chartDiv = document.getElementById(`${widgetId}_chart`);
                    const chart = echarts.init(chartDiv);
                    chart.setOption({
                        title: { text: 'Динамика платежей' },
                        tooltip: { trigger: 'axis' },
                        xAxis: { type: 'category', data: ['Янв', 'Фев', 'Мар', 'Апр', 'Май'] },
                        yAxis: { type: 'value' },
                        series: [{ type: 'bar', data: [120, 200, 150, 80, 70] }]
                    });

                } else if (type === 'stats') {
                    container.innerHTML = `
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                            <div style="background:#e8f5e9;padding:15px;border-radius:8px;text-align:center;">
                                <div style="font-size:24px;font-weight:bold;">1,234</div>
                                <div style="font-size:12px;">Всего платежей</div>
                            </div>
                            <div style="background:#e3f2fd;padding:15px;border-radius:8px;text-align:center;">
                                <div style="font-size:24px;font-weight:bold;">₽45,678</div>
                                <div style="font-size:12px;">Общая сумма</div>
                            </div>
                            <div style="background:#fff3e0;padding:15px;border-radius:8px;text-align:center;">
                                <div style="font-size:24px;font-weight:bold;">89%</div>
                                <div style="font-size:12px;">Успешных</div>
                            </div>
                            <div style="background:#fce4ec;padding:15px;border-radius:8px;text-align:center;">
                                <div style="font-size:24px;font-weight:bold;">+12%</div>
                                <div style="font-size:12px;">Рост</div>
                            </div>
                        </div>
                    `;
                } else if (type === 'text') {
                    container.innerHTML = `<div id="${widgetId}_text" style="white-space: pre-wrap;">Загрузка...</div>`;
                    try {
                        const res = await fetch('/api/index/content/');
                        const data = await res.json();
                        document.getElementById(`${widgetId}_text`).innerText = data.text;
                    } catch {
                        document.getElementById(`${widgetId}_text`).innerText = 'Ошибка загрузки текста';
                    }
                } else if (type === 'calendar') {
                    container.innerHTML = `
                        <div style="text-align:center;padding:20px;">
                            <div style="font-size:32px;">📅</div>
                            <div>Календарь событий</div>
                            <div style="margin-top:10px;font-size:12px;color:#666;">Здесь будет календарь</div>
                        </div>
                    `;
                }
            }

            // ===================== Управление дашбордом =====================
            const saveDashboard = () => {
                const widgets = grid.engine.nodes.map(node => ({
                    id: node.el.getAttribute('gs-id'),
                    x: node.x,
                    y: node.y,
                    w: node.width,
                    h: node.height,
                    type: node.el.querySelector('.widget-title')?.innerText.includes('Таблица') ? 'table' :
                        node.el.querySelector('.widget-title')?.innerText.includes('График') ? 'chart' :
                        node.el.querySelector('.widget-title')?.innerText.includes('Статистика') ? 'stats' :
                        node.el.querySelector('.widget-title')?.innerText.includes('Заметки') ? 'text' :
                        'calendar',
                    title: node.el.querySelector('.widget-title')?.innerText
                }));
                localStorage.setItem('dashboard_config', JSON.stringify({ widgets, savedAt: new Date().toISOString() }));
                alert('Дашборд сохранён');
            };

            const loadDashboard = () => {
                const saved = localStorage.getItem('dashboard_config');
                if (!saved) return;
                const config = JSON.parse(saved);
                grid.engine.nodes.slice().forEach(node => grid.removeWidget(node.el));
                config.widgets.forEach(w => addWidget(w.type, w.id, w.title, w.x, w.y, w.w, w.h));
            };

            const resetDashboard = () => {
                localStorage.removeItem('dashboard_config');
                grid.engine.nodes.slice().forEach(node => grid.removeWidget(node.el));

                addWidget('table', null, 'Платежи', 0, 0, 6, 4);
                addWidget('chart', null, 'График платежей', 6, 0, 6, 4);
                addWidget('stats', null, 'Статистика', 0, 4, 6, 3);
                addWidget('text', null, 'Заметки', 6, 4, 6, 3);
            };

            // ===================== Drag & Drop виджетов из правого сайдбара =====================
            const initDragAndDrop = () => {
                document.querySelectorAll('.widget-item').forEach(widget => {
                    widget.setAttribute('draggable', true);
                    widget.addEventListener('dragstart', e => {
                        e.dataTransfer.setData('text/plain', widget.dataset.type);
                        e.dataTransfer.effectAllowed = 'copy';
                    });
                });

                const gridContainer = document.querySelector('.grid-stack');
                gridContainer.addEventListener('dragover', e => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'copy';
                });
                gridContainer.addEventListener('drop', e => {
                    e.preventDefault();
                    const type = e.dataTransfer.getData('text/plain');
                    if (!type) return;
                    const rect = gridContainer.getBoundingClientRect();
                    const x = Math.floor((e.clientX - rect.left) / 200);
                    const y = grid.engine.nodes.length;
                    addWidget(type, null, null, x, y, 4, 3);
                });
            };

            // ===================== Инициализация =====================
            if (localStorage.getItem('dashboard_config')) loadDashboard();
            else resetDashboard();
            initDragAndDrop();

            document.getElementById('save-dashboard').addEventListener('click', saveDashboard);
            document.getElementById('reset-dashboard').addEventListener('click', resetDashboard);

        });
    </script>
</body>
</html>
