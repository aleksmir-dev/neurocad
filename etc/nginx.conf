# NeuroCad — nginx site template.
#
# This file is NOT used directly. It is a template that
# `neurocad install` reads from the package
# (neurocad/etc/nginx.conf), substitutes the placeholders below,
# and writes to /etc/nginx/sites-available/{name}.
#
# Placeholders (substituted at install time):
#   {name}         — server_name / domain, e.g. "neurocad.ru"
#   {app_host}     — backend host (default 127.0.0.1)
#   {app_port}     — backend port
#   {static_dir}   — absolute path to project static/
#   {media_dir}    — absolute path to project media/
#   {log_dir}      — project log/ dir (access + error logs)
#
# HTTPS is added afterwards by certbot:
#   certbot --nginx -d {name}
# certbot rewrites this file, adds a `listen 443 ssl` block, and
# installs the Let's Encrypt certificate. Running certbot again
# only updates certificate paths — the proxy config below stays.

server {
    listen 80;
    listen [::]:80;
    server_name {name};

    # Large uploads (page media, backups via UI, etc.).
    client_max_body_size 100M;

    # Logs (per-instance, next to the project).
    access_log {log_dir}/nginx-access.log;
    error_log  {log_dir}/nginx-error.log;

    # ACME challenge for certbot (before HTTPS is enabled).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Static files — served directly by nginx (faster than through Python).
    location /static/ {
        alias {static_dir}/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Media files — served directly by nginx.
    location /media/ {
        alias {media_dir}/;
        expires 7d;
        access_log off;
    }

    # Everything else → NeuroCad backend.
    location / {
        proxy_pass http://{app_host}:{app_port};
        proxy_http_version 1.1;

        # WebSocket support (LLM chat).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM responses may take minutes; disable buffering for WS.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
}