# NeuroCad — systemd unit template.
#
# This file is NOT used directly. It is a template that
# `neurocad install` reads from the package
# (neurocad/etc/system.conf), substitutes the placeholders below,
# and writes to /etc/systemd/system/{name}.service.
#
# Placeholders (substituted at install time):
#   {name}         — service name / domain (APP_DOMAIN), e.g. "neurocad.ru"
#   {project_dir}  — absolute path to the project (cwd at install)
#   {venv_bin}     — absolute path to the venv bin dir
#   {user}         — system user running the service
#   {group}        — system group
#   {home}         — HOME env var for the process
#   {app_host}     — bind host (default 127.0.0.1)
#   {app_port}     — bind port
#   {log_dir}      — project log/ dir
#
# Do not edit the installed file manually — it will be overwritten
# on the next `neurocad install --force`.

[Unit]
Description=NeuroCad — {name}
After=network.target

[Service]
Type=simple
User={user}
Group={group}
WorkingDirectory={project_dir}

# Full PATH — the standard system dirs must be present so rclone,
# curl, git, and getent are reachable from the app and from cron.
# Missing /usr/bin is the #1 cause of "FileNotFoundError: rclone"
# under systemd.
Environment="PATH={venv_bin}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
Environment="HOME={home}"

# Application bind and identity.
Environment="APP_HOST={app_host}"
Environment="APP_PORT={app_port}"
Environment="APP_DOMAIN={name}"
Environment="APP_SYSTEM_USER={user}"
Environment="DEBUG=False"

# Optional per-instance secrets / overrides. The leading `-` means
# "do not fail if this file is missing".
EnvironmentFile=-/etc/neurocad/{name}.env

ExecStart={venv_bin}/neurocad run
Restart=always
RestartSec=5

StandardOutput=append:{log_dir}/systemd.log
StandardError=append:{log_dir}/systemd.log

[Install]
WantedBy=multi-user.target