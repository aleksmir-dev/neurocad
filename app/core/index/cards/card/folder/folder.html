<!-- app/core/node/index/cards/card/folder/folder.html -->

<div class="core-node-index-cards-card-folder">
    <div class="form-group">
        <label>Название папки</label>
        <input type="text" class="folder-name" placeholder="Введите название папки" autocomplete="off">
    </div>
    <div class="form-group">
        <label>Описание</label>
        <textarea class="folder-description" placeholder="Введите описание папки"></textarea>
    </div>
    {% if user.is_superadmin %}
    <div class="form-group shared-group">
        <label class="checkbox-label">
            <input type="checkbox" class="folder-is-shared" value="1">
            <span>Сделать общими документами</span>
        </label>
        <small class="checkbox-hint">Все пользователи будут видеть эту папку в разделе "Общие документы"</small>
    </div>
    {% endif %}
</div>
