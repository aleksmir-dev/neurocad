<!-- app/core/base/base.html -->

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Нейрокад{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/code/base/images/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/static/code/base/images/favicon.ico">
    
    <!-- Bootstrap CSS локально -->
    <link rel="stylesheet" href="/static/core/base/libs/bootstrap-5.3.0/css/bootstrap.min.css">
    
    <!-- Bootstrap Icons локально -->
    <link rel="stylesheet" href="/static/code/base/libs/bootstrap-icons-1.11.3/bootstrap-icons.min.css">
    
    <!-- Кастомные CSS с версионированием -->
    <link rel="stylesheet" href="{{ 'core/base/base.css'|static }}">
    <link rel="stylesheet" href="{{ 'core/base/nav/nav.css'|static }}">
    <link rel="stylesheet" href="{{ 'core/base/toolbar.css'|static }}">
    <link rel="stylesheet" href="{{ 'core/base/subheader.css'|static }}">
    <link rel="stylesheet" href="{{ 'core/base/content.css'|static }}">
    <link rel="stylesheet" href="{{ 'core/base/footer/footer.css'|static }}">
    
    {% block head %}{% endblock %}

    <style>
        {% block css %}{% endblock %}
    </style>
    
    <script>
        window.APP_VERSION = '{{ request.state.app_version }}';
        
        // Функции для динамической загрузки статики
        window.loadCSS = function(url) {
            const fullUrl = window.APP_VERSION ? `${url}?v=${window.APP_VERSION}` : url;
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = fullUrl;
            document.head.appendChild(link);
            return link;
        };
        
        window.importJS = function(url) {
            const fullUrl = window.APP_VERSION ? `${url}?v=${window.APP_VERSION}` : url;
            return import(fullUrl);
        };
    </script>
</head>
<body class="core-base">
    {% include "core/base/nav/nav.html" %}
    <div class="core-base-toolbar">
        {% block toolbar %}{% endblock %}
    </div>
    <div class="core-base-subheader">
        {% block subheader %}{% endblock %}        
    </div>
    <main class="core-base-content">
        <div class="content-wrapper">
            {% block content %}{% endblock %}
        </div>
    </main>
    {% include "core/node/base/footer/footer.html" %}
    
    <!-- Bootstrap JS локально -->
    <script src="/static/code/base/libs/bootstrap-5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <!-- Базовые JS модули с версионированием -->
    <script src="{{ 'core/base/nav/nav.js'|static }}"></script>
    <script src="{{ 'core/base/footer/footer.js'|static }}"></script>
    <script src="{{ 'core/base/base.js'|static }}"></script>
    {% block external_js %}{% endblock %}
    <script>
        // Дочерние JS модули (встроенные, не внешние)
        {% block js %}{% endblock %}
    </script>
</body>
</html>
