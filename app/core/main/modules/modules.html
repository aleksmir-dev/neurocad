<!-- Модальное окно со списком модулей -->
<div class="core-main-modules modal fade" data-modal="list" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Управление модулями</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="modules-toolbar mb-3">
                    <div class="btn-group me-2">
                        <button type="button" class="btn btn-sm btn-primary" data-action="add"><i class="bi bi-plus-lg"></i> Добавить</button>
                        <button type="button" class="btn btn-sm btn-outline-primary" data-action="edit"><i class="bi bi-pencil-square"></i> Редактировать</button>
                        <button type="button" class="btn btn-sm btn-outline-danger" data-action="delete"><i class="bi bi-trash3"></i> Удалить</button>
                    </div>
                    <div class="btn-group me-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary" data-action="show-deleted"><i class="bi bi-archive"></i> Корзина</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" data-action="show-active"><i class="bi bi-grid-3x3-gap-fill"></i> Активные</button>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn btn-sm btn-outline-success" data-action="restore"><i class="bi bi-arrow-repeat"></i> Восстановить</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover table-sm modules-table">
                        <thead>
                            <tr><th style="width:40px"><input type="checkbox" class="form-check-input" data-action="select-all"></th>
                                <th>Название</th><th>URL</th><th>Описание</th><th style="width:100px">Дата</th></tr>
                        </thead>
                        <tbody data-field="modulesList"><tr><td colspan="5" class="text-center py-4">Загрузка...</td></tr></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <div class="me-auto"><span class="text-muted small" data-field="status">Готово</span></div>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно для редактирования -->
<div class="core-node-index-modules-edit modal fade" data-modal="edit" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" data-field="editTitle">Добавление модуля</h5>
                <button type="button" class="btn-close" data-action="close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" data-field="moduleId">
                <div class="mb-3"><label class="form-label">Название <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" data-field="name" placeholder="Введите название"></div>
                <div class="mb-3"><label class="form-label">URL</label>
                    <input type="text" class="form-control" data-field="url" placeholder="/core/crm/issue/days">
                    <div class="form-text">Абсолютный путь для перехода</div></div>
                <div class="mb-3"><label class="form-label">Описание</label>
                    <textarea class="form-control" data-field="description" rows="3" placeholder="Описание модуля"></textarea></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-action="cancel">Отмена</button>
                <button type="button" class="btn btn-primary" data-action="save">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно для сообщений -->
<div class="core-node-index-modules-msgbox modal fade" data-modal="msgbox" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" data-field="msgboxTitle">Сообщение</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body" data-field="msgboxMessage"></div>
            <div class="modal-footer"><button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button></div>
        </div>
    </div>
</div>

<!-- Модальное окно для подтверждения -->
<div class="core-node-index-modules-confirm modal fade" data-modal="confirm" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Подтверждение</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body" data-field="confirmMessage"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-action="cancel">Отмена</button>
                <button type="button" class="btn btn-danger" data-action="ok">OK</button>
            </div>
        </div>
    </div>
</div>
