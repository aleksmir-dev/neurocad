<!-- app/core/main/toolbar/toolbar.html -->

<div class="core-main-toolbar">
    <div class="toolbar-left">
        {# Кнопки управления видны только в Личном пространстве (section == 2) #}
        {% if section == 2 %}
            <button class="toolbar-btn btn-create">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/>
                </svg>
                <span>Создать</span>
            </button>
            
            <button class="toolbar-btn btn-edit" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/>
                </svg>
                <span>Редактировать</span>
            </button>
            
            <button class="toolbar-btn btn-delete" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/>
                </svg>
                <span>Удалить</span>
            </button>
            
            <button class="toolbar-btn btn-restore">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z" fill="currentColor"/>
                    <polygon points="15 9 11 13 8 10 6 12 11 17 17 11" fill="currentColor"/>
                </svg>
                <span>Восстановить</span>
            </button>
            
            {# Кнопки только для суперадмина #}
            {% if is_superadmin %}
                <button class="toolbar-btn btn-modules">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M4 6h16v2H4V6zm2-4h12v2H6V2zm16 8H2v12h20V10zm-2 10H4v-8h16v8z" fill="currentColor"/>
                    </svg>
                    <span>Модули</span>
                </button>
                
                <button class="toolbar-btn btn-permissions" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" fill="currentColor"/>
                    </svg>
                    <span>Права доступа</span>
                </button>
            {% endif %}
        {% endif %}
    </div>  
    <div class="toolbar-right">
        <div class="section-selector">
            <span class="section-option{% if section == 1 %} active{% endif %}" data-section-id="1">Общие документы</span>
            <span class="section-option{% if section == 2 %} active{% endif %}" data-section-id="2">Мои документы</span>
        </div>
    </div>
</div>
